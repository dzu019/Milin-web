<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Shotozakirei</title>
    
    <meta name="description" content="Official Links Shotozakirei">
    <meta property="og:title" content="Shotozakirei | Links">
    <meta property="og:description" content="Managed by Ilmi">
    <meta property="og:image" content="avatar.jpg">
    <link rel="icon" type="image/jpeg" href="avatar.jpg">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #a83232;
            --dark-red: #4b0a0a;
            --accent-red: #ff4d4d;
        }
        
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            outline: none; 
            -webkit-tap-highlight-color: transparent; 
            -webkit-user-select: none;
            user-select: none;
        }
        
        html, body {
            font-family: 'Space Grotesk', sans-serif;
            color: #eaeaea;
            background-color: #050000; 
            width: 100%;
            min-height: 100vh;
        }

        .fixed-bg-container {
            position: fixed; 
            top: 0; left: 0;
            width: 100vw;
            height: 100vh; 
            z-index: 0; 
            background: #0a0000;
        }

        #video-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.75) contrast(1.05);
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(10, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%); 
            z-index: 1; 
        }

        /* Elemen Partikel Elegan */
        .particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
        .particles span { 
            position: absolute; bottom: -50px; left: var(--left); font-size: var(--size); 
            animation: floatUp var(--duration) linear infinite; animation-delay: var(--delay); 
            opacity: 0; filter: drop-shadow(0 0 3px rgba(255, 77, 77, 0.3)); 
            color: var(--accent-red); /* Mengubah warna partikel ke merah */
        }
        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 10% { opacity: 0.6; } 90% { opacity: 0.6; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }

        /* Efek Klik Icon */
        .click-effect { position: fixed; pointer-events: none; animation: popOut 0.8s ease-out forwards; z-index: 9999; font-size: 20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4)); color: var(--accent-red); }
        @keyframes popOut { 0% { transform: scale(0.5) translateY(0); opacity: 1; } 100% { transform: scale(1.5) translateY(-40px); opacity: 0; } }


        .container {
            width: 100%;
            min-height: 100vh;
            max-width: 400px;
            margin: 0 auto;
            text-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            z-index: 2;
            position: relative;
        }

        @media (min-width: 768px) {
            .container {
                max-width: 420px;
                border-radius: 24px;
                background: rgba(15, 2, 2, 0.35);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255,255,255,0.05);
                margin: 5vh auto;
                min-height: 90vh;
                padding: 50px 30px;
            }
        }

        .ambient-glow {
            position: absolute;
            top: 15%;
            width: 180px;
            height: 180px;
            background: rgba(180, 0, 30, 0.35);
            filter: blur(50px);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }

        .share-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(28, 5, 5, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            cursor: pointer;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            z-index: 5;
        }

        .share-btn:hover, .share-btn:active {
            background: rgba(75, 10, 10, 0.85);
            border-color: rgba(180, 30, 30, 0.6);
            transform: scale(1.1);
        }

        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 2, 2, 0.9);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid rgba(180, 30, 30, 0.5);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            z-index: 100;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .toast i { margin-right: 8px; }
        .toast.show { bottom: 30px; }

        .skeleton-wrapper {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            transition: opacity 0.5s ease, visibility 0.5s ease;
            border-radius: inherit;
        }

        .skeleton-wrapper.loaded {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmerMove 1.5s infinite;
            border-radius: 50px;
        }

        @keyframes shimmerMove {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        .sk-avatar { width: 95px; height: 95px; border-radius: 50%; margin-bottom: 10px; }
        .sk-title { width: 160px; height: 24px; border-radius: 6px; margin-bottom: 8px; }
        .sk-subtitle { width: 110px; height: 14px; border-radius: 4px; margin-bottom: 8px; }
        .sk-bio { width: 180px; height: 12px; border-radius: 4px; margin-bottom: 30px; }
        .sk-card { width: 88%; height: 48px; margin-bottom: 14px; border-radius: 50px; }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        body.web-ready .fade-in { 
            opacity: 0; 
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }
        
        .delay-1 { animation-delay: 0.1s; } 
        .delay-2 { animation-delay: 0.25s; } 
        .delay-3 { animation-delay: 0.4s; } 

        /* Profile & Avatar Frame (Seperti Tema Sebelumnya, disesuaikan warna) */
        .profile-container { position: relative; margin: 0 auto 10px auto; width: fit-content; }
        
        .avatar-frame { 
            width: clamp(95px, 25vw, 110px); aspect-ratio: 1; margin: 0 auto; padding: 4px; 
            display: grid; place-items: center; position: relative; border-radius: 50%; 
            background: conic-gradient(from 25deg, rgba(139, 0, 0, 0.2), var(--primary-red), rgba(5, 0, 0, 0.5), var(--dark-red), rgba(139, 0, 0, 0.2)); 
            box-shadow: 0 0 0 4px rgba(168, 50, 50, 0.1), 0 0 20px rgba(139, 0, 0, 0.4); 
            animation: frame-breathe 4s ease-in-out infinite; 
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); 
        }
        
        .avatar-frame:hover { transform: scale(1.05); }
        
        .avatar-frame::after { 
            content: '❖'; /* Icon kecil di sudut */
            width: 24px; height: 24px; position: absolute; right: 0px; bottom: 0px; 
            display: grid; place-items: center; border: 2px solid rgba(255, 255, 255, 0.8); border-radius: 50%; 
            color: #fff; background: linear-gradient(135deg, var(--primary-red), #330000); 
            font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.6); transition: transform 0.3s; 
        }
        
        .avatar-frame:hover::after { transform: scale(1.15) rotate(15deg); }
        
        .avatar { 
            width: 100%; height: 100%; display: block; border-radius: 50%; 
            border: 2px solid rgba(255,255,255,0.7); object-fit: cover; 
            background: rgba(15, 0, 0, 0.7);
        }
        
        @keyframes frame-breathe { 50% { box-shadow: 0 0 0 6px rgba(168, 50, 50, 0.05), 0 0 25px rgba(139, 0, 0, 0.5); } }

        .greeting {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        /* Animasi Twinkle untuk Nama (Bintang) */
        h1 { 
            font-size: 1.4rem; 
            font-weight: 700;
            letter-spacing: 3px; 
            color: #ffffff; 
            text-transform: uppercase; 
            margin-bottom: 4px; 
            display: inline-flex; align-items: center; gap: 8px; justify-content: center; width: 100%;
        }
        
        h1 span { display: inline-block; animation: twinkle 1.5s infinite alternate; font-size: 1.1rem; color: var(--accent-red); }
        @keyframes twinkle { 0% { opacity: 0.4; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.1); } }

        .username { 
            font-size: 0.72rem; 
            font-weight: 600;
            color: var(--primary-red); 
            letter-spacing: 4px; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
        }

        .bio {
            font-size: 0.75rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .links-container { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            width: 88%; 
            margin: 0 auto; 
        }

        .link-card {
            position: relative;
            background: rgba(28, 5, 5, 0.65); 
            border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            padding: 14px 22px; 
            color: #ffffff; 
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600; 
            letter-spacing: 1.5px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                        background 0.3s ease,
                        border-color 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.6s ease;
        }

        .link-card i { 
            font-size: 1.15rem; 
            color: #ffffff; 
            width: 20px; 
            text-align: center;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .link-card span {
            transition: letter-spacing 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .link-card:hover, .link-card:active {
            background: rgba(75, 10, 10, 0.85);
            border-color: rgba(180, 30, 30, 0.6); 
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 0 22px rgba(139, 0, 0, 0.5), 0 10px 25px rgba(0, 0, 0, 0.7);
        }

        .link-card:hover::before, .link-card:active::before { left: 100%; }
        .link-card:hover i, .link-card:active i { transform: scale(1.2) rotate(-5deg); color: var(--accent-red); }
        .link-card:hover span, .link-card:active span { letter-spacing: 2px; }

        .ripple {
            position: absolute;
            border-radius: 50%;
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            background-color: rgba(255, 255, 255, 0.15);
            z-index: 1;
            pointer-events: none;
        }
          @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }

        .footer { 
            margin-top: 45px; 
            font-size: 0.6rem; 
            font-weight: 600;
            color: rgba(255, 255, 255, 0.25); 
            letter-spacing: 4px; 
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="fixed-bg-container">
        <video autoplay muted loop playsinline disablePictureInPicture id="video-bg">
            <source src="bg.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>
    
    <!-- Partikel Mengambang (Elegan, sesuai tema warna) -->
    <div class="particles" aria-hidden="true">
        <span style="--delay: 0s; --left: 15%; --duration: 8s; --size: 1rem;">✦</span>
        <span style="--delay: 3s; --left: 45%; --duration: 9s; --size: 0.8rem;">✧</span>
        <span style="--delay: 1s; --left: 80%; --duration: 7s; --size: 1.2rem;">✦</span>
        <span style="--delay: 5s; --left: 25%; --duration: 10s; --size: 0.7rem;">+</span>
        <span style="--delay: 2s; --left: 70%; --duration: 8.5s; --size: 0.9rem;">✧</span>
        <span style="--delay: 4.5s; --left: 90%; --duration: 7.5s; --size: 1.1rem;">✦</span>
    </div>

    <div id="toast" class="toast"><i class="fa-solid fa-check"></i>Link disalin!</div>

    <div class="container">
        
        <div class="share-btn fade-in" id="share-btn" aria-label="Share">
            <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>
        </div>

        <div class="ambient-glow"></div>

        <div class="skeleton-wrapper" id="skeleton">
            <div class="shimmer sk-avatar"></div>
            <div class="shimmer sk-title"></div>
            <div class="shimmer sk-subtitle"></div>
            <div class="shimmer sk-bio"></div>
            <div class="shimmer sk-card"></div>
            <div class="shimmer sk-card"></div>
            <div class="shimmer sk-card"></div>
            <div class="shimmer sk-card"></div>
        </div>
        
        <div class="fade-in delay-1">
            <!-- Frame Avatar Baru yang Bergerak -->
            <div class="profile-container">
                <div class="avatar-frame">
                    <img src="avatar.jpg" alt="Profile Shotozakirei" class="avatar">
                </div>
            </div>
            
            <div class="greeting" id="greeting"></div>
            
            <!-- Nama dengan efek bersinar elegan -->
            <h1><span>✦</span>Shotozakirei<span>✦</span></h1>
            
            <div class="username">@shotozakirei</div>
            <div class="bio">Tech Enthusiast | Linux Explorer</div>
        </div>

        <div class="links-container fade-in delay-2">
            <a href="https://open.spotify.com/user/31fr7mfuacdokppwhjcdi3zkzsla?si=2vas8obmST2ssZBLgJE0KA" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-spotify" aria-hidden="true"></i><span>Spotify</span>
            </a>

            <a href="https://www.instagram.com/m.shotozakirei?igsh=YmJoODdnYzNrcG02" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-instagram" aria-hidden="true"></i><span>Instagram</span>
            </a>

            <a href="https://tiktok.com/@alonerlonly" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-tiktok" aria-hidden="true"></i><span>TikTok</span>
            </a>

            <a href="https://www.instagram.com/dzul_019?xtok=MXAwdzh1NzFqNW05cA==" class="link-card" target="_blank" rel="noopener noreferrer">
                <i class="fa-brands fa-instagram" aria-hidden="true"></i><span>Ilmi</span>
            </a>
        </div>

        <div class="footer fade-in delay-3">MANAGED BY ILMI © 2026</div>
    </div>

    <script>
        window.addEventListener('load', () => {
            document.getElementById('skeleton').classList.add('loaded');
            document.body.classList.add('web-ready');
        });

        setTimeout(() => {
            if(!document.body.classList.contains('web-ready')) {
                document.getElementById('skeleton').classList.add('loaded');
                document.body.classList.add('web-ready');
            }
        }, 3000);

        const hour = new Date().getHours();
        const greetingEl = document.getElementById('greeting');
        if (hour >= 5 && hour < 11) greetingEl.innerText = "Selamat Pagi ✦";
        else if (hour >= 11 && hour < 15) greetingEl.innerText = "Selamat Siang ✦";
        else if (hour >= 15 && hour < 18) greetingEl.innerText = "Selamat Sore ✦";
        else greetingEl.innerText = "Selamat Malam ✦";

        const shareBtn = document.getElementById('share-btn');
        const toast = document.getElementById('toast');
        
        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: 'Shotozakirei | Links',
                text: 'Temukan profil dan link resmi dari Shotozakirei.',
                url: window.location.href
            };
            
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(window.location.href);
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }
        });

        const cards = document.querySelectorAll('.link-card');
        cards.forEach(card => {
            card.addEventListener('click', function(e) {
                const rect = this.getBoundingClientRect();
                const circle = document.createElement('span');
                const diameter = Math.max(this.clientWidth, this.clientHeight);
                const radius = diameter / 2;
                
                circle.style.width = circle.style.height = `${diameter}px`;
                circle.style.left = `${e.clientX - rect.left - radius}px`;
                circle.style.top = `${e.clientY - rect.top - radius}px`;
                circle.classList.add('ripple');
                
                const existingRipple = this.querySelector('.ripple');
                if(existingRipple) existingRipple.remove();
                
                this.appendChild(circle);
            });
        });
        
        /* Efek Klik Icon Elegan (Menyebar saat diklik di mana saja) */
        document.addEventListener('click', function(e) {
            // Hindari memunculkan icon jika yang diklik adalah link card atau share button
            if(e.target.closest('.link-card') || e.target.closest('.share-btn')) return;
            
            const drop = document.createElement('div');
            const icons = ['✦', '✧', '+', '⨯'];
            drop.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            drop.className = 'click-effect';
            drop.style.left = (e.clientX - 10) + 'px';
            drop.style.top = (e.clientY - 10) + 'px';
            document.body.appendChild(drop);
            setTimeout(() => drop.remove(), 800);
        });
    </script>
</body>
</html>
