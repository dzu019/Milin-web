<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Links | Shotozakirei</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            outline: none; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        html, body {
            font-family: 'Space Grotesk', sans-serif;
            color: #eaeaea;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
        }

        .fixed-bg-container {
            position: fixed; 
            top: 0; left: 0;
            width: 100vw;
            height: 100vh; 
            z-index: 0; 
        }

        #video-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: brightness(0.8) contrast(1.05); /* Sedikit ditegaskan agar kontras naik */
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            /* Gradient vignette gelap profesional */
            background: radial-gradient(circle at center, rgba(10, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.8) 100%); 
            z-index: 1; 
        }

        .container {
            width: 100%;
            height: 100%;
            max-width: 400px;
            margin: 0 auto;
            text-align: center; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2;
            position: relative;
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .fade-in { opacity: 0; animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-1 { animation-delay: 0.15s; } 
        .delay-2 { animation-delay: 0.3s; } 
        .delay-3 { animation-delay: 0.45s; } 

        .avatar {
            width: 95px; 
            height: 95px;
            border-radius: 50%; 
            border: 2px solid rgba(139, 0, 0, 0.6); 
            padding: 4px; 
            margin: 0 auto 15px auto;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.3), 0 8px 25px rgba(0, 0, 0, 0.8);
            background: rgba(15, 0, 0, 0.7);
            animation: floatAvatar 4s ease-in-out infinite;
            object-fit: cover;
        }

        @keyframes floatAvatar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 { 
            font-size: 1.4rem; 
            font-weight: 700;
            letter-spacing: 3px; 
            color: #ffffff; 
            text-transform: uppercase; 
            margin-bottom: 4px; 
        }

        .username { 
            font-size: 0.72rem; 
            font-weight: 600;
            color: #a83232; 
            letter-spacing: 4px; 
            margin-bottom: 35px; 
            text-transform: uppercase; 
        }

        .links-container { 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            width: 88%; 
            margin: 0 auto; 
        }

        .link-card {
            /* Menaikkan opasitas background & border tipis yang bersih agar tetap gelap tapi TEGAS */
            background: rgba(28, 5, 5, 0.65); 
            border-radius: 50px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            padding: 14px 22px; 
            color: #ffffff; 
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600; 
            letter-spacing: 1.5px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }

        /* Semua logo tetap putih bersih seperti semula */
        .link-card i { 
            font-size: 1.15rem; 
            color: #ffffff; 
            width: 20px; 
            text-align: center; 
        }

        /* Hover style profesional: Glow merah crimson lebih clean */
        .link-card:hover {
            background: rgba(75, 10, 10, 0.85);
            border-color: rgba(180, 30, 30, 0.6); 
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.4), 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .footer { 
            margin-top: 45px; 
            font-size: 0.6rem; 
            font-weight: 600;
            color: rgba(255, 255, 255, 0.25); 
            letter-spacing: 4px; 
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="fixed-bg-container">
        <video autoplay muted loop playsinline id="video-bg">
            <source src="bg.mp4" type="video/mp4">
        </video>
        <div class="overlay"></div>
    </div>

    <div class="container">
        
        <div class="fade-in delay-1">
            <img src="avatar.jpg" alt="Profile" class="avatar">
            <h1>Shotozakirei</h1>
            <div class="username">@shotozakirei</div>
        </div>

        <div class="links-container fade-in delay-2">
            <a href="https://open.spotify.com/user/31fr7mfuacdokppwhjcdi3zkzsla?si=2vas8obmST2ssZBLgJE0KA" class="link-card" target="_blank">
                <i class="fa-brands fa-spotify"></i><span>Spotify</span>
            </a>

            <a href="https://www.instagram.com/m.shotozakirei?igsh=YmJoODdnYzNrcG02" class="link-card" target="_blank">
                <i class="fa-brands fa-instagram"></i><span>Instagram</span>
            </a>

            <a href="https://tiktok.com/@alonerlonly" class="link-card" target="_blank">
                <i class="fa-brands fa-tiktok"></i><span>TikTok</span>
            </a>

            <a href="https://www.instagram.com/dzul_019?xtok=MXAwdzh1NzFqNW05cA==" class="link-card" target="_blank">
                <i class="fa-brands fa-instagram"></i><span>Ilmi</span>
            </a>
        </div>

        <div class="footer fade-in delay-3">MANAGED BY ILMI © 2026</div>
    </div>

</body>
</html>
